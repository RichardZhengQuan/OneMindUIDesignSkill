<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="onemind-ui-design-version" content="{{SKILL_VERSION}}">
  <title>{{OBJECTIVE_NAME}} — Choose a style</title>
  <link rel="stylesheet" href="library.css?v={{SKILL_VERSION}}-remove-size-39">
</head>
<body class="library-home library-standards-page library-style-page" data-objective="{{OBJECTIVE_SLUG}}" data-created="{{CREATED_DATE}}" data-library-page="style">
  <header class="library-home-bar">
    <a class="library-brand" href="index.html" aria-label="OneMind UI Design home">
      <span class="library-brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="library-brand-name">OneMind UI Design</span>
    </a>
  </header>

  <main class="library-standards-main" id="style-library" data-library-level="style">
    <aside class="library-primary-drawer" aria-label="Library navigation" data-standards-aria="library">
      <p class="library-primary-drawer-title" data-standards-copy="libraryTitle">Library</p>
      <nav>
        <a href="style.html" aria-current="page"><span data-copy="navStyle">Style</span></a>
        <a href="guide.html"><span data-copy="navGuide">Standards</span></a>
        <a href="elements.html"><span data-copy="navElements">Elements</span></a>
        <a href="components.html"><span data-copy="navComponents">Components</span></a>
        <a href="pages.html"><span data-copy="navPages">Pages</span></a>
      </nav>
    </aside>

    <section class="library-standards-content library-style-content" aria-labelledby="style-title">
      <header class="library-standards-heading">
        <p data-style-copy="kicker">Starting point</p>
        <h1 id="style-title" data-style-copy="title">Choose a style</h1>
        <p data-style-copy="description">Pick the visual character that best fits this objective. You can fine-tune individual foundations under Elements.</p>
      </header>

      <fieldset class="library-style-choices" id="style-choice-list">
        <legend class="visually-hidden" data-style-copy="choiceLegend">Style choices</legend>
        <label class="library-style-choice" id="style-floating">
          <input type="radio" name="style-preset" value="floating">
          <span class="library-style-choice-preview library-style-choice-preview-floating" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="library-style-choice-copy">
            <strong data-style-copy="floatingTitle">Floating</strong>
            <span data-style-copy="floatingDescription">Turn side drawers, navigation, and content views into detached floating panels.</span>
          </span>
          <span class="library-style-choice-check" aria-hidden="true">✓</span>
        </label>
        <label class="library-style-choice" id="style-lines">
          <input type="radio" name="style-preset" value="lines">
          <span class="library-style-choice-preview library-style-choice-preview-lines" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="library-style-choice-copy">
            <strong data-style-copy="linesTitle">Lines</strong>
            <span data-style-copy="linesDescription">Keep the current line-led system with aligned edges and quiet dividers.</span>
          </span>
          <span class="library-style-choice-check" aria-hidden="true">✓</span>
        </label>
      </fieldset>
      <p class="library-style-note" data-style-copy="note">This selection changes the shared foundation across the library.</p>
    </section>
  </main>
  <script src="design-settings.js?v={{SKILL_VERSION}}"></script>
  <script src="library.js?v={{SKILL_VERSION}}-remove-size-39"></script>
</body>
</html>
